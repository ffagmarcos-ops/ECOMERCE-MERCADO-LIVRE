            function base64ToFile(base64Data, filename, mimeType) {
                const binaryString = window.atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const blob = new Blob([bytes], { type: mimeType });
                return new File([blob], filename, { type: mimeType });
            }

                const toast = document.createElement('div');
                toast.className = `flex items-center gap-3 p-4 rounded-xl border bg-admin-card shadow-2xl animate-slide-in-right pointer-events-auto min-w-[280px]`;
                
                let borderClass = 'border-green-500/20';
                let iconClass = 'fa-solid fa-circle-check text-green-500';
                if (type === 'error') {
                    borderClass = 'border-red-500/20';
                    iconClass = 'fa-solid fa-circle-xmark text-red-400';
                } else if (type === 'info') {
                    borderClass = 'border-amber-500/20';
                    iconClass = 'fa-solid fa-circle-info text-amber-500';
                }

                toast.classList.add(borderClass);
                
                toast.innerHTML = `
                    <div class="text-lg"><i class="${iconClass}"></i></div>
                    <div class="flex-1 text-xs font-semibold text-gray-200 leading-tight">${message}</div>
                    <button class="text-gray-500 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
                `;

                toast.querySelector('button').addEventListener('click', () => {
                    toast.remove();
                });

                toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.remove();
                }, 4000);
            }

                try {
                    const response = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });

                    const payload = await response.json();

                    btn.className = `flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap border-b-2`;

                        btn.className += ` border-transparent text-admin-textMuted hover:text-white hover:bg-white/5`;

                    btn.innerHTML = `<i class="${tab.icon}"></i> ${tab.label}`;
                    
                    btn.addEventListener('click', () => {

                        activeTabId = tab.id;

                // --- INICIALIZADOR PREMIUM DE UPLOAD E PRÉVIAS DE IMAGENS ---
                if (!window.isUploadInitialized) {
                    window.isUploadInitialized = true;
                    
                    // Helper para ler arquivos de upload, comprimir no canvas e preencher base64
                    const handleImageUpload = (fileInputId, textInputId, previewImgId, placeholderId) => {
                        const fileInput = document.getElementById(fileInputId);
                        const textInput = document.getElementById(textInputId);
                        const previewImg = document.getElementById(previewImgId);
                        const placeholderEl = document.getElementById(placeholderId);

                        if (!fileInput || !textInput) return;

                        fileInput.addEventListener('change', (e) => {
                            const file = e.target.files[0];
                            if (!file) return;

                            if (!file.type.startsWith('image/')) {
                                showToast('Selecione uma imagem válida!', 'error');
                                return;
                            }

                            const reader = new FileReader();
                            showToast('Comprimindo imagem local...', 'info');

                            reader.onload = (event) => {
                                const img = new Image();
                                img.src = event.target.result;
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    const ctx = canvas.getContext('2d');

                                    // Limite máximo de 600px para manter o tamanho no localStorage leve (máx 30KB)
                                    const MAX_WIDTH = 600;
                                    const MAX_HEIGHT = 600;
                                    let width = img.width;
                                    let height = img.height;

                                    if (width > height) {
                                        if (width > MAX_WIDTH) {
                                            height *= MAX_WIDTH / width;
                                            width = MAX_WIDTH;
                                        }
                                    } else {
                                        if (height > MAX_HEIGHT) {
                                            width *= MAX_HEIGHT / height;
                                            height = MAX_HEIGHT;
                                        }
                                    }

                                    canvas.width = width;
                                    canvas.height = height;
                                    ctx.drawImage(img, 0, 0, width, height);

                                    // Comprime para formato JPEG leve com qualidade 0.65
                                    const base64 = canvas.toDataURL('image/jpeg', 0.65);
                                    
                                    textInput.value = base64;
                                    previewImg.src = base64;
                                    previewImg.classList.remove('hidden');
                                    if (placeholderEl) placeholderEl.classList.add('hidden');

                                    showToast('✓ Imagem importada com sucesso!', 'success');
                                };
                            };
                            reader.readAsDataURL(file);
                        });
                    };

                    // Sincronizador de campos de texto com as caixas de prévia visual
                    const bindPreviewSync = (textInputId, previewImgId, placeholderId) => {
                        const textInput = document.getElementById(textInputId);
                        const previewImg = document.getElementById(previewImgId);
                        const placeholderEl = document.getElementById(placeholderId);

                        if (!textInput || !previewImg) return () => {};

                        const update = () => {
                            const val = textInput.value.trim();
                            if (val) {
                                previewImg.src = val;
                                previewImg.classList.remove('hidden');

                            } else {
                                previewImg.src = '';
                                previewImg.classList.add('hidden');
                                if (placeholderEl) placeholderEl.classList.remove('hidden');
                            }
                        };

                        textInput.addEventListener('input', update);
                        textInput.addEventListener('change', update);
                        return update;
                    };

                    handleImageUpload('upload-img-1', 'prod-img', 'preview-img-1', 'preview-placeholder-1');

                // --- HELPERS DE EXTRAÇÃO DE PRODUTO ---
                function categorizeProduct(title) {
                    const low = (title||'').toLowerCase();
                    if (/cafeteira|espremedor|panela|chaleira|copo|liquidificador|frigideira|cozinha/.test(low)) return 'casa';
                    if (/aspirador|organizador|gaveta|cabide|armario|prateleira/.test(low)) return 'organização';
                    if (/maquiagem|cabelo|secador|creme|perfume|shampoo|esmalte|batom|pele|beleza/.test(low)) return 'beleza';
                    if (/carregador|fone|cabo|smartwatch|caixa de som|led|ring light|celular|tablet|notebook|bluetooth/.test(low)) return 'eletrônicos';
                    return 'utilidades';
                }

                function parseGalleryImages(html) {
                    // Try DOM parsing first for the gallery container
                    try {
                        const domParser = new DOMParser();
                        const doc = domParser.parseFromString(html, 'text/html');
                        const galleryImgs = doc.querySelectorAll('.ui-pdp-gallery img, .ui-pdp-gallery__figure img, [class*="ui-pdp-gallery"] img, .gallery__picture img, img[class*="gallery"]');
                        let domUrls = [];
                        galleryImgs.forEach(img => {
                            let src = img.getAttribute('data-zoom') || img.getAttribute('src') || img.getAttribute('data-src') || '';
                            if (src && src.includes('mlstatic.com') && !src.startsWith('data:')) {
                                domUrls.push(src);
                            }
                        });
                        
                        if (domUrls.length > 0) {
                            // Standardize and extract IDs
                            const matches = domUrls.map(url => {
                                const m = url.match(/D_(?:N)?Q_NP_(?:2X_)?([0-9]+-[a-zA-Z0-9_-]+)-(?:O|F|V|AB|O)\./i);
                                return m ? m[1] : null;
                            }).filter(Boolean);
                            
                            const unique = [...new Set(matches)];
                            if (unique.length > 0) {
                                const imgUrl = `https://http2.mlstatic.com/D_NQ_NP_2X_${unique[0]}-O.webp`;
                                const imgUrl2 = unique[1] ? `https://http2.mlstatic.com/D_NQ_NP_2X_${unique[1]}-O.webp` : '';
                                return { imgUrl, imgUrl2 };
                            }
                        }
                    } catch (e) {}

                    // Fallback: Regex Search in HTML
                    const imgMatches = [...html.matchAll(/https:\/\/http2\.mlstatic\.com\/D_(?:N)?Q_NP_(?:2X_)?([0-9]+-[a-zA-Z0-9_-]+)-(?:O|F|V|AB|O)\.(webp|jpg|jpeg|png)/gi)].map(m => m[1]);
                    
                    // Filter to only include product picture IDs (pattern: [digits]-[MLx][digits]_[digits])
                    // Standard format is e.g. 644611-MLA96137565645_102025
                    const filteredMatches = imgMatches.filter(id => /[0-9]+-[A-Z]{3}[0-9]+_[0-9]+/i.test(id));
                    
                    // Fallback if filter is too strict
                    const finalMatches = filteredMatches.length > 0 ? filteredMatches : imgMatches;
                    
                    const uniqueImgIds = [...new Set(finalMatches)];
                    const imgUrl = uniqueImgIds[0] ? `https://http2.mlstatic.com/D_NQ_NP_2X_${uniqueImgIds[0]}-O.webp` : '';
                    const imgUrl2 = uniqueImgIds[1] ? `https://http2.mlstatic.com/D_NQ_NP_2X_${uniqueImgIds[1]}-O.webp` : '';
                    return { imgUrl, imgUrl2 };
                }

                function parseVideo(html) {
                    const ytMatch = html.match(/youtube\.com\/(?:embed\/|watch\?v=|shorts\/)([a-zA-Z0-9_-]{11})/i) || html.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/i);
                    if (ytMatch) {
                        return `https://www.youtube.com/watch?v=${ytMatch[1]}`;
                    }
                    const mp4Match = html.match(/https?:\/\/[^\s"']+\.mp4(?:\?[^\s"']*)?/i);
                    if (mp4Match) {
                        return mp4Match[0];
                    }
                    return '';
                }

                function parseJsonLd(html) {
                    const matches = html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi);
                    for (const match of matches) {
                        try {
                            const data = JSON.parse(match[1]);
                            const type = data['@type'] || '';
                            if (type === 'Product' || type === 'ItemPage') {
                                const title = (data.name || '').trim();
                                const offers = data.offers;
                                let price = 0, oldPrice = 0;
                                if (offers) {
                                    if (Array.isArray(offers)) {
                                        price = parseFloat(offers[0]?.price) || 0;
                                    } else {
                                        price = parseFloat(offers.price) || 0;
                                    }
                                }
                                const rawImg = data.image;
                                const imgUrl = Array.isArray(rawImg) ? rawImg[0] : (rawImg || '');
                                if (title) return { title, price, oldPrice, imgUrl };
                            }
                        } catch(e) {}
                    }
                    return null;
                }

                function parseMetaTags(html) {
                    const titleM = html.match(/property=["']og:title["'][^>]*content=["']([^"']{5,})["']/i)
                                 || html.match(/content=["']([^"']{5,})["'][^>]*property=["']og:title["']/i);
                    const imgM   = html.match(/property=["']og:image["'][^>]*content=["']([^"']+)["']/i)
                                 || html.match(/content=["']([^"']+)["'][^>]*property=["']og:image["']/i);
                    const priceM = html.match(/itemprop=["']price["'][^>]*content=["']([\d.]+)["']/i)
                                 || html.match(/content=["']([\d.]+)["'][^>]*itemprop=["']price["']/i)
                                 || html.match(/"price"\s*:\s*"?(\d+\.?\d*)"?/);

                    const title = titleM ? titleM[1].split(' | ')[0].split(' - Frete')[0].trim() : '';
                    return {
                        title,
                        price: priceM ? parseFloat(priceM[1]) : 0,
                        oldPrice: 0,
                        imgUrl: imgM ? imgM[1] : ''
                    };
                }

                function fillProductForm({ title, price, oldPrice, imgUrl, imgUrl2, videoUrl, rawUrl }) {
                    if (title) document.getElementById('prod-name').value = title;
                    if (price > 0) {
                        document.getElementById('prod-price').value = price.toFixed(2);
                        document.getElementById('prod-old-price').value = (oldPrice > price ? oldPrice : price * 1.25).toFixed(2);
                    }
                    
                    if (imgUrl) document.getElementById('prod-img').value = imgUrl;
                    if (imgUrl2) document.getElementById('prod-img-2').value = imgUrl2;
                    if (videoUrl) document.getElementById('prod-video').value = videoUrl;
                    
                    const cat = categorizeProduct(title);
                    document.getElementById('prod-category').value = cat;

                // === MOTOR DE DETECÇÃO - CORSPROXY + JSON-LD PARSER ===
                document.getElementById('prod-fetch-btn').addEventListener('click', async () => {
                    const rawUrl = document.getElementById('prod-url').value.trim();

                    if (!rawUrl) {
                        showToast('Cole o link do produto primeiro!', 'error');
                        return;
                    }

                    const btn = document.getElementById('prod-fetch-btn');
                    btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-1"></i> Detectando`;
                    btn.disabled = true;

                    function extractMLBId(str) {
                        if (!str) return null;
                        const mParam = str.match(/(?:item_id|wid)[%:=]+(MLB\d+)/i);
                        if (mParam) return mParam[1].toUpperCase();
                        const m = str.match(/MLB[-_]?(\d{7,12})/i);
                        return m ? 'MLB' + m[1] : null;
                    }

                    function toCanonicalUrl(url) {
                        if (url.toLowerCase().includes('/p/mlb')) {
                            return url.split('?')[0].split('#')[0];
                        }
                        const mlbId = extractMLBId(url);
                        if (mlbId) return `https://produto.mercadolivre.com.br/${mlbId.replace('MLB','MLB-')}`;
                        return url;
                    }

                    const PROXIES = [
                        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,

                    ];

                    async function fetchHtml(targetUrl) {
                        for (const buildProxyUrl of PROXIES) {
                            try {
                                const res = await fetch(buildProxyUrl(targetUrl), { 
                                    signal: AbortSignal.timeout(10000) 
                                });
                                if (res.ok) {
                                    const text = await res.text();
                                    if (text.length > 5000 && !text.includes('ui-empty-state')) {
                                        return text;
                                    }
                                }
                            } catch(e) { /* try next */ }
                        }
                        return null;
                    }

                    try {
                        if (rawUrl.includes('meli.la') || rawUrl.includes('click.linksynergy') || rawUrl.includes('bit.ly')) {
                            throw new Error('Links encurtados (meli.la) não podem ser detectados automaticamente. Por favor, cole o link original completo ou use o Bypass Código Fonte.');
                        }

                        if (rawUrl.includes('/social/') || rawUrl.includes('/perfil/') || (!rawUrl.includes('MLB') && !rawUrl.includes('mercadolivre'))) {
                            throw new Error('Este link parece ser de uma loja, não de um produto. Cole a URL original de um produto.');
                        }

                        const targetUrl = toCanonicalUrl(rawUrl);
                        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-1"></i> Carregando...`;

                        const html = await fetchHtml(targetUrl);
                        if (!html) {
                            throw new Error('Não foi possível obter dados. Use a caixa de colagem de Código Fonte (Bypass) abaixo para carregar instantaneamente.');
                        }

                        let parsed = parseJsonLd(html);
                        if (!parsed || !parsed.title) {
                            parsed = parseMetaTags(html);
                        }

                        if (!parsed || !parsed.title) {
                            const parts = targetUrl.split('/').filter(s => s.includes('-') && s.length > 10 && !/^MLB/i.test(s));
                            const slugTitle = parts[0] ? parts[0].replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) : '';
                            if (!slugTitle) throw new Error('Não foi possível extrair dados. Preencha manualmente ou cole o Código Fonte HTML.');
                            
                            const gallery = parseGalleryImages(html);
                            const videoUrl = parseVideo(html);

                            fillProductForm({
                                title: slugTitle,
                                price: 0,
                                oldPrice: 0,
                                imgUrl: gallery.imgUrl,
                                imgUrl2: gallery.imgUrl2,
                                videoUrl: videoUrl,
                                rawUrl: rawUrl
                            });
                            showToast('⚠️ Título parcialmente detectado. Complete o preço e imagem.', 'info');
                        } else {
                            const gallery = parseGalleryImages(html);
                            const videoUrl = parseVideo(html);

                            fillProductForm({
                                title: parsed.title,
                                price: parsed.price,
                                oldPrice: parsed.oldPrice,
                                imgUrl: gallery.imgUrl || parsed.imgUrl,
                                imgUrl2: gallery.imgUrl2,
                                videoUrl: videoUrl,
                                rawUrl: rawUrl
                            });

                            const hasAll = parsed.title && parsed.price > 0 && (gallery.imgUrl || parsed.imgUrl);
                            if (hasAll) {
                                showToast('✅ Produto detectado com sucesso! Verifique e confirme as informações.', 'success');
                            } else {
                                showToast('⚠️ Produto parcialmente detectado. Complete os campos em branco.', 'info');
                            }
                        }

                    } catch (err) {
                        console.error('Detecção ML erro:', err);
                        showToast(`❌ ${err.message}`, 'error');
                    } finally {
                        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-down mr-1"></i> Detectar`;
                        btn.disabled = false;
                    }
                });

                // === MOTOR DE SINCRONIZAÇÃO COMPLETA DE VITRINES (URL E HTML BYPASS) ===
                const syncBtn = document.getElementById('sync-vanessa-btn');
                const syncParseHtmlBtn = document.getElementById('sync-parse-html-btn');
                const syncUrlInput = document.getElementById('sync-url');
                const logContainer = document.getElementById('sync-log-container');
                const logDetails = document.getElementById('sync-log-details');
                const statusText = document.getElementById('sync-status-text');
                const progressBar = document.getElementById('sync-progress-bar');
                const syncSpinner = document.getElementById('sync-spinner');
                const syncTimer = document.getElementById('sync-timer');

                async function startShowcaseSync(syncUrl, rawHtml = '') {
                    const isManualBypass = !!rawHtml;
                    if (!syncUrl && !rawHtml) {
                        showToast('Cole o link da vitrine ou o código fonte HTML!', 'error');
                        return;
                    }

                    // Reset and configure controls
                    syncBtn.disabled = true;
                    if (syncParseHtmlBtn) syncParseHtmlBtn.disabled = true;
                    logContainer.classList.remove('hidden');
                    logDetails.innerHTML = '';
                    progressBar.style.width = '5%';
                    syncSpinner.className = 'fa-solid fa-spinner animate-spin text-admin-accentBlue';
                    statusText.innerText = 'Iniciando Sincronização...';
                    
                    let startTime = Date.now();
                    let timerInterval = setInterval(() => {
                        let elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                        syncTimer.innerText = `${elapsed}s`;
                    }, 100);

                    function addLog(msg, type = 'info') {
                        const line = document.createElement('div');
                        let icon = '⚡';
                        let colorClass = 'text-admin-textMuted';
                        if (type === 'success') { icon = '✅'; colorClass = 'text-emerald-400 font-bold'; }
                        if (type === 'error') { icon = '❌'; colorClass = 'text-red-400 font-bold'; }
                        if (type === 'warn') { icon = '⚠️'; colorClass = 'text-amber-400'; }
                        
                        line.className = `text-[10px] font-mono leading-relaxed ${colorClass}`;
                        line.innerHTML = `<span class="mr-1">${icon}</span> ${msg}`;
                        logDetails.appendChild(line);
                        logDetails.scrollTop = logDetails.scrollHeight;
                    }

                    try {
                        let html = rawHtml;
                        if (!isManualBypass) {
                            addLog('Conectando ao Mercado Livre via Proxies Autorizados...');
                            progressBar.style.width = '15%';
                            
                            const PROXIES = [
                                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                                url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
                            ];

                            html = null;
                            let proxyUsed = '';
                            
                            for (let i = 0; i < PROXIES.length; i++) {
                                const proxyBuilder = PROXIES[i];
                                const targetUrl = proxyBuilder(syncUrl);
                                const proxyName = i === 0 ? 'CORSProxy.io' : i === 1 ? 'AllOrigins' : 'CodeTabs';
                                
                                addLog(`Tentando conexão com o servidor de proxy: ${proxyName}...`);
                                try {
                                    const res = await fetch(targetUrl, { signal: AbortSignal.timeout(10000) });
                                    if (res.ok) {
                                        const text = await res.text();
                                        if (text.length > 10000 && !text.includes('ui-empty-state')) {
                                            html = text;
                                            proxyUsed = proxyName;
                                            addLog(`Conectado com sucesso através do proxy: ${proxyName}!`, 'success');
                                            break;
                                        } else {
                                            addLog(`Proxy ${proxyName} retornou resposta vazia ou bloqueada.`, 'warn');
                                        }
                                    } else {
                                        addLog(`Proxy ${proxyName} falhou com status: ${res.status}`, 'warn');
                                    }
                                } catch(e) {
                                    addLog(`Timeout ou falha na tentativa do proxy ${proxyName}.`, 'warn');
                                }
                            }

                            if (!html) {
                                throw new Error('Não foi possível obter os dados do Mercado Livre. O servidor está bloqueando temporariamente. Use o Bypass de Código Fonte colando o HTML da vitrine scrolada para importar os 53 produtos de forma garantida.');
                            }
                        } else {
                            addLog('Iniciando análise do código fonte HTML colado...', 'success');
                        }

                        progressBar.style.width = '35%';
                        statusText.innerText = 'Extraindo produtos da Vitrine...';
                        addLog('Descodificando dados de produtos (State & DOM Parser)...');

                        let items = [];

                        // 1. NORDIC PREHYDRATION STATE PARSER
                        addLog('Analisando preloaded state do Mercado Livre (Nordic Context)...');
                        let state = null;
                        const matchNordic = html.match(/_n\.ctx\.r\s*=\s*(\{[\s\S]*?\});/i);
                        if (matchNordic) {
                            try {
                                state = JSON.parse(matchNordic[1]);
                                addLog('Nordic Rendering Context decodificado com sucesso!', 'success');
                            } catch (e) {
                                addLog(`Falha ao decodificar JSON do Nordic State: ${e.message}`, 'warn');
                            }
                        }

                        if (state && state.appProps && state.appProps.pageProps && Array.isArray(state.appProps.pageProps.polycards)) {
                            const polycards = state.appProps.pageProps.polycards;
                            addLog(`Encontrados ${polycards.length} cartões no preloaded state.`);
                            polycards.forEach(card => {
                                const metadata = card.metadata || {};
                                const mlbId = metadata.id || '';
                                const urlPart = metadata.url || '';
                                const permalink = urlPart ? (urlPart.startsWith('http') ? urlPart : `https://${urlPart}`) : '';
                                
                                const components = card.components || [];
                                const titleComp = components.find(c => c.type === 'title') || {};
                                const title = titleComp.title ? titleComp.title.text : '';
                                
                                const priceComp = components.find(c => c.type === 'price') || {};
                                const price = (priceComp.price && priceComp.price.current_price) ? parseFloat(priceComp.price.current_price.value) : 0;
                                
                                const brandComp = components.find(c => c.type === 'brand') || {};
                                const brandText = brandComp.brand ? brandComp.brand.text : '';
                                
                                const pics = card.pictures ? (card.pictures.pictures || []) : [];
                                const picId = pics[0] ? pics[0].id : '';
                                const thumbnail = picId ? `https://http2.mlstatic.com/D_NQ_NP_2X_${picId}-O.webp` : '';
                                
                                if (title && price > 0 && permalink) {
                                    items.push({
                                        mlbId,
                                        title,
                                        price,
                                        thumbnail,
                                        permalink,
                                        brand: brandText
                                    });
                                }
                            });
                        }

                        // 2. HIGH-FIDELITY DOM SELECTOR PARSER
                        addLog('Executando DOM Selector Parser sobre o HTML da vitrine...');
                        try {
                            const domParser = new DOMParser();
                            const doc = domParser.parseFromString(html, 'text/html');
                            const cards = doc.querySelectorAll('.poly-card, .lists-card, [class*="poly-card"], [class*="lists-card"], .bookmark-card, [class*="bookmark-card"], .wishlist-item, [class*="wishlist-item"]');
                            
                            if (cards.length > 0) {
                                addLog(`Localizados ${cards.length} elementos de cartões de produtos via DOM!`, 'success');
                                cards.forEach((card, idx) => {
                                    const aEl = card.querySelector('a[href*="/p/"], a[href*="/MLB-"], a[href*="/up/"], a[href*="-JM"]');
                                    if (!aEl) return;
                                    
                                    const permalink = aEl.getAttribute('href') || '';
                                    
                                    const titleEl = card.querySelector('[class*="__title"], [class*="-title"]');
                                    let title = titleEl ? titleEl.textContent.trim() : aEl.textContent.trim();
                                    
                                    if (!title) {
                                        const slugMatch = permalink.match(/mercadolivre\.com\.br\/([a-z0-9\-]+)(?:\/p\/|\/up\/|\/MLB-)/i);
                                        title = slugMatch ? slugMatch[1].replace(/-/g, ' ').toUpperCase() : 'Produto Mercado Livre';
                                    }
                                    title = title.replace(/\s+/g, ' ');

                                    const priceEl = card.querySelector('[class*="__current"], [class*="-price"], [class*="price-tag"]');
                                    let price = 0;
                                    if (priceEl) {
                                        const priceText = priceEl.textContent || '';
                                        const priceM = priceText.match(/R\$\s*([\d.]+)(?:,(\d{2}))?/i);
                                        if (priceM) {
                                            price = parseFloat(priceM[1].replace(/\./g, '').replace(',', '.'));
                                        }
                                    }

                                    const imgEl = card.querySelector('img');
                                    let imgUrl = '';
                                    if (imgEl) {
                                        const dataSrc = imgEl.getAttribute('data-src') || imgEl.getAttribute('data-srcset') || imgEl.getAttribute('srcset') || '';
                                        const srcAttr = imgEl.getAttribute('src') || '';
                                        
                                        if (dataSrc && !dataSrc.startsWith('data:')) {
                                            imgUrl = dataSrc;
                                        } else if (srcAttr && !srcAttr.startsWith('data:')) {
                                            imgUrl = srcAttr;
                                        } else {
                                            // Search all attributes for a valid image url
                                            for (let attr of imgEl.attributes) {
                                                if (attr.value && attr.value.includes('mlstatic.com') && !attr.value.startsWith('data:')) {
                                                    imgUrl = attr.value;
                                                    break;
                                                }
                                            }
                                        }
                                        
                                        if (imgUrl.includes(' ')) {
                                            imgUrl = imgUrl.split(' ')[0];
                                        }
                                        
                                        // Standardize image sizes
                                        if (imgUrl) {
                                            imgUrl = imgUrl.replace('-I.', '-O.').replace('-V.', '-O.').replace('-AB.', '-O.');
                                            if (imgUrl.startsWith('http://')) {
                                                imgUrl = imgUrl.replace('http://', 'https://');
                                            }
                                        }
                                    }

                                    const mParam = permalink.match(/(?:item_id|wid)[%:=]+(MLB\d+)/i);
                                    let mlbId = mParam ? mParam[1].toUpperCase() : null;
                                    if (!mlbId) {
                                        const m = permalink.match(/MLB[-_]?(\d{7,12})/i);
                                        mlbId = m ? 'MLB' + m[1] : null;
                                    }

                                    if (title && price > 0 && permalink && !["Tudo pra você", "Lista de afiliados", "VANESSAPARVATI | Perfil social", "Live Content"].includes(title)) {
                                        items.push({
                                            mlbId: mlbId || `MLB${Date.now() + idx}`,
                                            title,
                                            price,
                                            thumbnail: imgUrl,
                                            permalink
                                        });
                                    }
                                });
                            }
                        } catch (domErr) {
                            addLog(`Erro no DOM Parser: ${domErr.message}`, 'warn');
                        }

                        // 3. REGEX FALLBACK DETECTORS
                        if (items.length === 0) {
                            addLog('Detectores primários vazios. Executando Regex Fallback de State...', 'warn');
                            const pattern = /\{"id":"(MLB\d+)","title":"([^"]+)","price":(\d+\.?\d*),"currency_id":"BRL".*?,"thumbnail":"([^"]+)".*?,"permalink":"([^"]+)"/g;
                            let match;
                            while ((match = pattern.exec(html)) !== null) {
                                const [_, mlbId, title, price, thumbnail, permalink] = match;
                                items.push({
                                    mlbId,
                                    title,
                                    price: parseFloat(price),
                                    thumbnail,
                                    permalink
                                });
                            }
                        }

                        // Deduplicate products
                        let uniqueItemsMap = {};
                        items.forEach(item => {
                            if (item.title && item.price > 0 && item.permalink) {
                                // Strip track codes from permalink for cleaner keys
                                let baseLink = item.permalink.split('?')[0];
                                uniqueItemsMap[baseLink] = item;
                            }
                        });
                        const finalItems = Object.values(uniqueItemsMap);

                        if (finalItems.length === 0) {
                            throw new Error('Nenhum produto válido contendo preço e link foi localizado na página. Certifique-se de rolar a página até o fim antes de copiar o código fonte.');
                        }

                        addLog(`Extração concluída com sucesso! Localizados ${finalItems.length} produtos únicos.`, 'success');
                        progressBar.style.width = '55%';
                        statusText.innerText = 'Categorizando produtos e aplicando comissões...';

                        function categorize(title) {
                            const low = title.toLowerCase();
                            if (/cafeteira|liquidificador|espremedor|panela|chaleira|faqueiro|sanduicheira|cozinha|mesa|prato|copo|garfo/.test(low)) return 'casa';
                            if (/aspirador|mop|vassoura|organizador|selador|suporte|cabide|cadeira|prateleira|cesto|gaveta/.test(low)) return 'organização';
                            if (/fone|led|luminaria|som|bluetooth|ventilador|relógio|carregador|smartwatch|televisão|tv|monitor|computador|notebook|celular|smartphone|tablet/.test(low)) return 'eletrônicos';
                            if (/maquiagem|pincel|batom|creme|shampoo|perfume|cuidados|pele|cabelo|secador|chapinha/.test(low)) return 'beleza';
                            if (/vestido|camisa|calça|sapato|bota|jaqueta|blusa|bolsa|moda|tênis|roupa/.test(low)) return 'moda';
                            if (/bola|chuteira|raquete|academia|fitness|peso|musculação|esporte|bicicleta|suplemento|whey/.test(low)) return 'esporte';
                            if (/ração|cachorro|gato|coleira|pet|brinquedo pet|caminha|areia|arranhador/.test(low)) return 'pet';
                            if (/brinquedo|bebê|fralda|carrinho de bebê|mamadeira|chupeta|infantil|lego|boneca|carrinho|pelúcia/.test(low)) return 'infantil';
                            if (/furadeira|chave de fenda|martelo|parafuso|ferramenta|serra|alicate|trena|parafusadeira/.test(low)) return 'ferramentas';
                            if (/playstation|xbox|nintendo|jogo|game|console|controle|headset gamer/.test(low)) return 'games';
                            if (/livro|caderno|papelaria|caneta|lápis|marcador|agenda|mochila|estojo/.test(low)) return 'livros';
                            return 'utilidades';
                        }

                        function getEmoji(cat) {
                            const emojiMap = { 
                                casa: '☕', 'organização': '🧹', beleza: '💄', 'eletrônicos': '⚡', utilidades: '🛍️',
                                moda: '👕', esporte: '⚽', pet: '🐾', infantil: '🧸', ferramentas: '🔨', games: '🎮', livros: '📚'
                            };
                            return emojiMap[cat] || '🛍️';
                        }

                        function round(num, decimals) {
                            const t = Math.pow(10, decimals);
                            return parseFloat((num * t).toFixed(decimals));
                        }

                        let syncedProducts = finalItems.map((item, idx) => {
                            const cat = categorize(item.title);
                            let basePermalink = item.permalink.split('?')[0];
                            if (!basePermalink.startsWith('http')) {
                                basePermalink = 'https://' + basePermalink.replace(/^\/+/, '');
                            }
                            let affiliateUrl = `${basePermalink}?matt_tool=80930673&matt_word=vanessaparvati&forceInApp=true`;
                            
                            let img = item.thumbnail;
                            if (img) {
                                img = img.replace('-I.', '-O.').replace('-V.', '-O.').replace('-AB.', '-O.');
                                if (img.startsWith('http://')) {
                                    img = img.replace('http://', 'https://');
                                }
                            }

                            let brand = "Curadoria";
                            const brandsList = ["Britânia", "Mondial", "Wap", "Tramontina", "Unitermi", "Cadence", "Philco", "Arno", "Samsung", "Xiaomi", "Oster", "Midea"];
                            for (const b of brandsList) {
                                if (item.title.toLowerCase().includes(b.toLowerCase())) {
                                    brand = b;
                                    break;
                                }
                            }

                            const finalId = item.mlbId ? (isNaN(item.mlbId.replace('MLB','')) ? item.mlbId : parseInt(item.mlbId.replace('MLB',''))) : (Date.now() + idx);

                            return {
                                id: finalId,
                                name: item.title,
                                category: cat,
                                brand: brand,
                                price: item.price,
                                oldPrice: round(item.price * 1.25, 2),
                                badge: idx < 3 ? 'Destaque' : 'Afiliado',
                                emoji: getEmoji(cat),
                                glowColor: "rgba(255,26,117,0.3)",
                                searchKeys: `${item.title.toLowerCase()} ${cat} ${brand} vanessa`,
                                url: affiliateUrl,
                                img_url: img
                            };
                        });

                        // Load current database and merge synced products
                        let currentCustomProducts = JSON.parse(localStorage.getItem('admin-custom-products')) || [];
                        if (currentCustomProducts.length === 0) {
                            currentCustomProducts = [...DEFAULT_PRODUCTS];
                        }

                        let productsToEnrich = [];

                        syncedProducts.forEach(syncedProd => {
                            const cleanSyncedUrl = syncedProd.url.split('?')[0];
                            let matchIndex = currentCustomProducts.findIndex(p => p.id === syncedProd.id);
                            if (matchIndex === -1) {
                                matchIndex = currentCustomProducts.findIndex(p => p.url && p.url.split('?')[0] === cleanSyncedUrl);
                            }

                            if (matchIndex !== -1) {

            async function fetchWithRetry(url, options, retries = 5) {
                const delays = [1000, 2000, 4000, 8000, 16000];
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error?.message || `Erro HTTP! Status: ${response.status}`);
                        return data;
                    } catch (e) {
                        if (i === retries - 1) throw e;
                        await new Promise(res => setTimeout(res, delays[i]));
                    }
                }
            }

            function ensureAffiliateLink(url) {

                let trimmed = url.trim();
                if (trimmed.includes('mercadolivre.com') || trimmed.includes('mercado-livre') || trimmed.includes('meli.la')) {
                    if (!trimmed.includes('matt_tool=')) {

                        trimmed = `${trimmed}${separator}matt_tool=80930673&matt_word=vanessaparvati&forceInApp=true`;
                    }
                }
                return trimmed;
            }

            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                });
            }

            function createPaddedImageBase64(file, targetRatio) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        let targetW, targetH;
                        if (targetRatio === '1:1') {
                            const size = Math.max(img.width, img.height);
                            targetW = size;
                            targetH = size;
                        } else if (targetRatio === '9:16') {
                            const currentRatio = img.width / img.height;
                            const tr = 9 / 16;
                            if (currentRatio > tr) {
                                targetW = img.width;
                                targetH = Math.round(img.width / tr);
                            } else {
                                targetH = img.height;
                                targetW = Math.round(img.height * tr);
                            }
                        } else {
                            targetW = img.width; 
                            targetH = img.height;
                        }

                        canvas.width = targetW;
                        canvas.height = targetH;
                        
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, targetW, targetH);
                        
                        const dx = (targetW - img.width) / 2;
                        const dy = (targetH - img.height) / 2;
                        ctx.drawImage(img, dx, dy);
                        
                        const dataUrl = canvas.toDataURL(file.type || 'image/jpeg');
                        resolve({
                            mimeType: file.type || 'image/jpeg',
                            data: dataUrl.split(',')[1]
                        });
                    };
                    img.onerror = reject;
                    img.src = URL.createObjectURL(file);
                });
            }

            function base64ToArrayBuffer(base64) {
                const binaryString = window.atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes.buffer;
            }

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            function pcmToWav(pcmData, sampleRate) {
                const numChannels = 1; 
                const bitsPerSample = 16;
                const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
                const blockAlign = numChannels * (bitsPerSample / 8);
                
                const wavHeader = new ArrayBuffer(44);
                const view = new DataView(wavHeader);
                
                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + pcmData.byteLength, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, byteRate, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, bitsPerSample, true);
                writeString(view, 36, 'data');
                view.setUint32(40, pcmData.byteLength, true);
                
                const wavBytes = new Uint8Array(44 + pcmData.byteLength);
                wavBytes.set(new Uint8Array(wavHeader), 0);
                wavBytes.set(new Uint8Array(pcmData), 44);
                return wavBytes;
            }

                                            <div class="flex items-center gap-2">
                                                <i class="fa-solid fa-wand-magic-sparkles text-admin-accentGold animate-pulse"></i>

                                            <span class="text-[9px] font-bold text-admin-textMuted uppercase bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg">

                                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3" id="reference-uploads-grid">
                                            <!-- Preenchido pelo Javascript -->
