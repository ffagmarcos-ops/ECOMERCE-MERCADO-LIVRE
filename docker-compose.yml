services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 30mariafn@
      MARIADB_DATABASE: tudopravoce_db
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - default

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 30mariafn@
      DB_NAME: tudopravoce_db
      DB_RETRY_ATTEMPTS: 15
      DB_RETRY_DELAY_MS: 3000
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.achadinhos-http.rule=Host(`achadinhos.digmidia.com`)
      - traefik.http.routers.achadinhos-http.entrypoints=web
      - traefik.http.routers.achadinhos-http.middlewares=achadinhos-https-redirect
      - traefik.http.middlewares.achadinhos-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.achadinhos.rule=Host(`achadinhos.digmidia.com`)
      - traefik.http.routers.achadinhos.entrypoints=websecure
      - traefik.http.routers.achadinhos.tls=true
      - traefik.http.routers.achadinhos.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.achadinhos.loadbalancer.server.port=3000
    networks:
      - default
      - proxy

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://phpmyadmin.achadinhos.digmidia.com
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.achadinhos-phpmyadmin-http.rule=Host(`phpmyadmin.achadinhos.digmidia.com`)
      - traefik.http.routers.achadinhos-phpmyadmin-http.entrypoints=web
      - traefik.http.routers.achadinhos-phpmyadmin-http.middlewares=achadinhos-phpmyadmin-https-redirect
      - traefik.http.middlewares.achadinhos-phpmyadmin-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.achadinhos-phpmyadmin.rule=Host(`phpmyadmin.achadinhos.digmidia.com`)
      - traefik.http.routers.achadinhos-phpmyadmin.entrypoints=websecure
      - traefik.http.routers.achadinhos-phpmyadmin.tls=true
      - traefik.http.routers.achadinhos-phpmyadmin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.achadinhos-phpmyadmin.service=achadinhos-phpmyadmin
      - traefik.http.services.achadinhos-phpmyadmin.loadbalancer.server.port=80
    networks:
      - default
      - proxy

volumes:
  mariadb_data:

networks:
  proxy:
    external: true
    name: traefik